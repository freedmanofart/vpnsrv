services:

  postgres:
    image: postgres:17
    container_name: vpn-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - vpn-backend


  api:
    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: vpn-api
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}

      THREEXUI_API_TOKEN: ${THREEXUI_API_TOKEN:-}
      THREEXUI_VERIFY_TLS: ${THREEXUI_VERIFY_TLS:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me}
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      PAYMENT_AUTO_CONFIRM: ${PAYMENT_AUTO_CONFIRM:-false}
      PROMO_CODES: ${PROMO_CODES:-WELCOME7:7}
      BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED:-false}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./api/app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - vpn-backend

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: vpn-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]

    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      THREEXUI_API_TOKEN: ${THREEXUI_API_TOKEN:-}
      THREEXUI_VERIFY_TLS: ${THREEXUI_VERIFY_TLS:-true}
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      BACKGROUND_JOBS_ENABLED: "true"
      LIFECYCLE_INTERVAL_SECONDS: ${LIFECYCLE_INTERVAL_SECONDS:-60}
      LIFECYCLE_ADVISORY_LOCK_KEY: ${LIFECYCLE_ADVISORY_LOCK_KEY:-846202608}
      WORKER_RUN_ONCE: ${WORKER_RUN_ONCE:-false}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./api/app:/app/app

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - vpn-backend


  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile

    container_name: vpn-bot
    restart: unless-stopped

    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      API_URL: ${API_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      VPN_PLAN_ID: ${VPN_PLAN_ID}
      VPN_NODE_ID: ${VPN_NODE_ID}
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN}
      TELEGRAM_CHANNEL_URL: ${TELEGRAM_CHANNEL_URL:-}
      SUPPORT_URL: ${SUPPORT_URL:-}
      BOT_PLAN_CODES: ${BOT_PLAN_CODES:-vpn_14d,vpn_30d,vpn_90d}
      YOOMONEY_PAYMENT_URL: ${YOOMONEY_PAYMENT_URL:-}
      YOOMONEY_14D_URL: ${YOOMONEY_14D_URL:-}
      YOOMONEY_30D_URL: ${YOOMONEY_30D_URL:-}
      YOOMONEY_90D_URL: ${YOOMONEY_90D_URL:-}
      TRY_PAYMENT_URL: ${TRY_PAYMENT_URL:-}

    volumes:
      - ./bot/app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

    depends_on:
      api:
        condition: service_healthy

    networks:
      - vpn-backend

volumes:
  postgres_data:
    name: vpn-postgres-data

networks:
  vpn-backend:
    name: vpn-backend
    driver: bridge
