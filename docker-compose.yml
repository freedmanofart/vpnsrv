services:

  api:
    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: vpn-api
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}

      THREEXUI_API_TOKEN: ${THREEXUI_API_TOKEN:-}
      THREEXUI_VERIFY_TLS: ${THREEXUI_VERIFY_TLS:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me}
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      PAYMENT_AUTO_CONFIRM: ${PAYMENT_AUTO_CONFIRM:-false}
      PROMO_CODES: ${PROMO_CODES:-WELCOME7:7}
      BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CABINET_TOKEN_TTL_DAYS: ${CABINET_TOKEN_TTL_DAYS:-365}
      CABINET_EMAIL_CODE_TTL_MINUTES: ${CABINET_EMAIL_CODE_TTL_MINUTES:-10}
      CABINET_ALLOW_TEMPORARY_REGISTRATION: ${CABINET_ALLOW_TEMPORARY_REGISTRATION:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_ADMIN_CHAT_ID: ${BOT_ADMIN_CHAT_ID:-0}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-freedmanofart5@gmail.com}
      VPN_BACKUP_DIR: ${VPN_BACKUP_DIR:-/var/backups/vpn-service}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./api/app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - /var/backups/vpn-service:/var/backups/vpn-service

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - vpn-backend

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: vpn-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]

    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      THREEXUI_API_TOKEN: ${THREEXUI_API_TOKEN:-}
      THREEXUI_VERIFY_TLS: ${THREEXUI_VERIFY_TLS:-true}
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      BACKGROUND_JOBS_ENABLED: "true"
      LIFECYCLE_INTERVAL_SECONDS: ${LIFECYCLE_INTERVAL_SECONDS:-60}
      LIFECYCLE_ADVISORY_LOCK_KEY: ${LIFECYCLE_ADVISORY_LOCK_KEY:-846202608}
      SUBSCRIPTION_EXPIRATION_REMINDER_DAYS: ${SUBSCRIPTION_EXPIRATION_REMINDER_DAYS:-3}
      WORKER_RUN_ONCE: ${WORKER_RUN_ONCE:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-freedmanofart5@gmail.com}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./api/app:/app/app

    networks:
      - vpn-backend


  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile

    container_name: vpn-bot
    restart: unless-stopped

    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_ADMIN_CHAT_ID: ${BOT_ADMIN_CHAT_ID:-0}
      API_URL: ${API_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      VPN_PLAN_ID: ${VPN_PLAN_ID}
      VPN_NODE_ID: ${VPN_NODE_ID}
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN}
      TELEGRAM_CHANNEL_URL: ${TELEGRAM_CHANNEL_URL:-}
      SUPPORT_URL: ${SUPPORT_URL:-}
      WEB_CABINET_URL: ${WEB_CABINET_URL:-}
      WEB_SITE_URL: ${WEB_SITE_URL:-}
      BOT_PLAN_CODES: ${BOT_PLAN_CODES:-}
      YOOMONEY_PAYMENT_URL: ${YOOMONEY_PAYMENT_URL:-}
      YOOMONEY_14D_URL: ${YOOMONEY_14D_URL:-}
      YOOMONEY_30D_URL: ${YOOMONEY_30D_URL:-}
      YOOMONEY_90D_URL: ${YOOMONEY_90D_URL:-}
      TRY_PAYMENT_URL: ${TRY_PAYMENT_URL:-}

    volumes:
      - ./bot/app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

    depends_on:
      api:
        condition: service_healthy

    networks:
      - vpn-backend

networks:
  vpn-backend:
    name: vpn-backend
    driver: bridge
