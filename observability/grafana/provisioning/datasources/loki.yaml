apiVersion: 1
prune: true

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      timeout: 60
      maxLines: 2000
      derivedFields:
        - name: RequestID
          matcherRegex: '"request_id":"([^"\\]+)"'
          url: '$${__value.raw}'
