services:
  xui:
    image: freedomvpn/3x-ui-kit:95f19b1-kit1.2
    container_name: xui-kit
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      XUI_ENABLE_FAIL2BAN: "true"
      XRAY_VMESS_AEAD_FORCED: "false"
      TZ: Europe/Moscow
    volumes:
      - ./db:/etc/x-ui
      - ./cert:/root/cert
      - ./acme:/root/.acme.sh
      - ./logs:/var/log/x-ui

  kit-sub:
    image: freedomvpn/3x-ui-kit:95f19b1-kit1.2
    container_name: xui-kit-sub
    profiles: [subscription]
    restart: unless-stopped
    network_mode: host
    entrypoint: ["python3", "/opt/kit/kit-sub.py"]
    environment:
      KIT_SUB_CONFIG: /etc/kit-sub/config.json
      KIT_SUB_RULES: /etc/kit-sub/rules.yaml
    volumes:
      - ./kit-sub/config.json:/etc/kit-sub/config.json:ro
      - ./kit-sub/rules.yaml:/etc/kit-sub/rules.yaml:ro
      - ./cert:/root/cert:ro
    depends_on:
      - xui
