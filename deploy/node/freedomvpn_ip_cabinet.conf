# Loaded from nginx's http context on the Russian VPN node. The stream listener
# still terminates TLS here; this virtual host forwards the public IP site to
# the Freedom VPN master through its private Tailscale address.
server {
    listen 127.0.0.1:10446 ssl http2 proxy_protocol;
    server_name 176.108.250.142;

    ssl_certificate /root/cert/kit-ip/fullchain.pem;
    ssl_certificate_key /root/cert/kit-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_tokens off;
    absolute_redirect off;
    access_log off;
    client_max_body_size 15m;

    # MagicDNS resolves the master to its 100.x tailnet address. The system
    # resolver can return public Funnel IPs, which fail from this relay.
    resolver 100.100.100.100 valid=30s ipv6=off;
    set $freedomvpn_master freedomvpn.taile485ac.ts.net;

    # IP SNI selects this server instead of KIT's default virtual host.
    # Keep these client paths aligned with /etc/nginx/conf.d/kit.conf.
    location = /vq9gdbxfk9 {
        proxy_pass http://127.0.0.1:2081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_read_timeout 1h;
    }

    location = /uark0be8nb {
        proxy_pass http://127.0.0.1:2087;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_read_timeout 1h;
    }

    location /lds9tydq/ {
        grpc_pass grpc://127.0.0.1:2083;
        grpc_set_header X-Real-IP $proxy_protocol_addr;
        grpc_read_timeout 1h;
        grpc_send_timeout 1h;
        client_max_body_size 0;
    }

    location / {
        # Nginx includes signed subscription URLs in upstream TLS errors.
        # Keep those URLs out of error logs; monitor HTTP status via health.
        error_log /var/log/nginx/freedomvpn-ip-cabinet-error.log crit;
        proxy_pass https://$freedomvpn_master$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host freedomvpn.taile485ac.ts.net;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name freedomvpn.taile485ac.ts.net;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_redirect https://freedomvpn.taile485ac.ts.net/ https://176.108.250.142/;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
